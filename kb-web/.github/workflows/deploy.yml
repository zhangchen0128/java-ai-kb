name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: kb-web/package-lock.json }
      - run: npm ci
        working-directory: kb-web
      - run: npm run validate
        working-directory: kb-web
      - run: npm test
        working-directory: kb-web
      - run: npm run build
        working-directory: kb-web
      - name: Test clean build
        run: |
          rm -rf kb-web/public
          npm run build
        working-directory: kb-web
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with: { path: kb-web/public }

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
