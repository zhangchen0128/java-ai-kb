<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<meta name="description" content="Java AI 工程师知识库 - 覆盖 Java 企业开发到 AI 应用工程的完整知识体系">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Java AI 知识库">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>📚</text></svg>">
<title>Java AI 知识库</title>
<link rel="stylesheet" href="app.css?v=8">
<script defer src="app.js?v=8"></script>
</head>
<body>

<header id="topbar">
  <button id="menuBtn" aria-label="菜单" aria-controls="sidebar" aria-expanded="false" title="导航菜单">☰</button>
  <span class="brand"><span class="brand-icon">📚</span><span class="brand-text">Java AI 知识库</span></span>
  <div id="searchBox">
    <input type="search" id="searchInput" placeholder="搜索知识点…" autocomplete="off">
    <span class="search-hint">⌘K</span>
    <button id="clearSearch" aria-label="清除">✕</button>
  </div>
  <label id="verifiedFilter" class="verified-filter" title="按需只查看已完成联合复核的内容">
    <input type="checkbox" id="verifiedOnly">
    <span>仅已验证</span>
  </label>
  <button id="themeBtn" aria-label="切换暗色模式" title="暗色模式">🌙</button>
</header>

<nav id="sidebar" aria-label="知识库导航">
  <div class="sidebar-inner">
    <div id="navTree" aria-live="polite"><div class="nav-loading">正在加载导航…</div></div>
  </div>
</nav>

<main id="content">
  <div id="progressBar"></div>
  <div id="article">
    <div class="welcome">
      <h1>📚 Java AI 工程师知识库</h1>
      <p class="subtitle">覆盖 Java 企业开发到 AI 应用工程的公开可验证知识体系</p>
      <div class="stats">
        <div class="stat"><strong>19</strong><span>知识域</span></div>
        <div class="stat"><strong>86</strong><span>篇笔记</span></div>
        <div class="stat"><strong>35</strong><span>已验证</span></div>
      </div>
      <div class="quick-nav">
        <h3>快速导航</h3>
        <div class="domain-grid" id="domainGrid"></div>
      </div>
    </div>
  </div>
  <div id="prevNext"></div>
  <footer class="site-footer">
    <p>Java AI 工程师知识库 · 来源可追溯 · 示例关联 Lab</p>
    <p style="margin-top:4px"><a href="https://github.com/zhangchen0128/java-ai-kb" target="_blank">GitHub</a></p>
  </footer>
</main>

<aside id="toc" hidden>
  <div class="toc-title">📑 本页目录</div>
  <nav id="tocNav"></nav>
</aside>

<button id="backToTop" aria-label="返回顶部" title="返回顶部">↑</button>

<div id="overlay"></div>

<div id="searchResults" class="search-dropdown">
  <div class="search-results-inner" id="searchResultsInner"></div>
</div>

<script>
if ('serviceWorker' in navigator) {
  const hadController = Boolean(navigator.serviceWorker.controller);
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController && !refreshing) {
      refreshing = true;
      location.reload();
    }
  });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
    .then(registration => registration.update())
    .catch(error => console.warn('Service Worker registration failed', error));
}
</script>
</body>
</html>
