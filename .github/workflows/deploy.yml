name: Quality Gate & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kb-web/package-lock.json

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Install Node dependencies
        run: npm ci
        working-directory: kb-web

      - name: Install Chromium for smoke tests
        run: npx playwright install --with-deps chromium
        working-directory: kb-web

      - name: Validate, test, deeply audit and build the site
        run: npm run check
        working-directory: kb-web

      - name: Test all eight Maven labs without API keys
        run: mvn -B -f labs/pom.xml test

      - name: Verify clean public build
        run: |
          rm -rf public
          npm run build
        working-directory: kb-web

      - name: Run browser smoke tests
        run: npm run smoke
        working-directory: kb-web

      - name: Audit links changed by this pull request
        if: github.event_name == 'pull_request'
        run: npm run audit:links -- --changed
        working-directory: kb-web

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: kb-web/reports/
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: kb-web/public

  deploy:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
