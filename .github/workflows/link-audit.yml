name: Weekly Link Audit

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kb-web/package-lock.json
      - run: npm ci
        working-directory: kb-web
      - name: Audit every unique external URL
        run: npm run audit:links
        working-directory: kb-web
      - name: Upload link reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-link-audit
          path: kb-web/reports/link-audit-report.*
          if-no-files-found: error
